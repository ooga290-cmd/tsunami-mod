name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tsunami-mod
    steps:
      
uses: actions/checkout@v4

      
uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

      
uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

      
name: Build
      run: gradle build

      
uses: actions/upload-artifact@v4
      with:
        name: tsunami-mod
        path: |
          tsunami-mod/build/libs/.jar
          !tsunami-mod/build/libs/-sources.jar
